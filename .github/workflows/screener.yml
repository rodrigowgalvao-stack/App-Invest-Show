name: Screener diário

on:
  schedule:
    - cron: "17 21 * * 1-5"   # segunda a sexta, 18h17 de Brasília (depois do fechamento)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Rodar screener
        run: python screener/screener.py
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}  # opcional: a lista de ações funciona sem token

      - name: Publicar resultado
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add dados/oportunidades.json dados/fundamentos.json
          git diff --cached --quiet || git commit -m "Oportunidades $(date +%F)"
          git push
